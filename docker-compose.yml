services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - SCAN_ENGINE_URL=http://scan-engine:8000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - scan-engine

  scan-engine:
    build: ./scan-engine
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
